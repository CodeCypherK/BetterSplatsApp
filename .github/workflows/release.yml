name: release

on:
  push:
    tags:
      - "v*"
  # Dispatch path: creates the tag server-side via `gh release create
  # --target`, so releases can be cut from environments where pushing
  # refs/tags is blocked.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/ios-app.yml

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: BetterSplats-ipa
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "BetterSplats $TAG" \
            --generate-notes
