name: release

on:
  push:
    tags:
      - "v*"
  # Dispatch path: creates the tag server-side via `gh release create
  # --target`, so releases can be cut from environments where pushing
  # refs/tags is blocked.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/ios-app.yml

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: BetterSplats-ipa
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
        run: |
          # The release may already exist when the tag was created through
          # the GitHub UI ("draft a new release" fires this workflow via the
          # tag push) — upload into it instead of failing.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.ipa \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/*.ipa \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "BetterSplats $TAG" \
              --generate-notes
          fi
